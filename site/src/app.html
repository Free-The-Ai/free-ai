<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Domain guard — redirect unauthorized mirrors to the canonical host.
			// Speed bump, not a wall: source-readable, but forces forker action.
			(function () {
				var h = location.hostname;
				var ok = ['freetheai.xyz', 'localhost', '127.0.0.1', '0.0.0.0'];
				for (var i = 0; i < ok.length; i++) {
					if (h === ok[i] || h.endsWith('.' + ok[i])) return;
				}
				location.replace('https://freetheai.xyz' + location.pathname + location.search + location.hash);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
